<!-- hello.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Hello">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#f107a3"/>
    </linearGradient>
    <style>
      .title { font: 700 22px/1 "Segoe UI", Roboto, sans-serif; fill: url(#g1); }
      .sm { font: 400 12px/1 "Segoe UI", Roboto, sans-serif; fill: #444; }
      .wave { transform-origin: 60% 60%; animation: wave 1.4s infinite ease-in-out; }
      .float { animation: float 3s infinite ease-in-out; }
      @keyframes wave {
        0% { transform: rotate(0deg); }
        20% { transform: rotate(18deg); }
        40% { transform: rotate(-12deg); }
        60% { transform: rotate(10deg); }
        80% { transform: rotate(-6deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }
      .bg { opacity: 0.95; }
    </style>
  </defs>

  <!-- background rounded card -->
  <rect x="10" y="10" rx="24" ry="24" width="280" height="280" fill="#fff" stroke="rgba(120,120,120,0.08)"/>
  <g transform="translate(40,60)" class="float">
    <!-- laptop body -->
    <rect x="0" y="20" rx="8" ry="8" width="180" height="100" fill="#0f1724"/>
    <rect x="6" y="26" rx="6" ry="6" width="168" height="72" fill="#0b1220"/>
    <!-- screen gradient text -->
    <text x="18" y="60" class="title">Hello,</text>
    <g transform="translate(90,40)" class="wave">
      <!-- little waving hand -->
      <g transform="scale(0.8)">
        <path d="M12 2c.6 0 1 .4 1 1v3c0 .6-.4 1-1 1s-1-.4-1-1V4c0-.6.4-1 1-1z" fill="#ffd166"/>
        <circle cx="6" cy="12" r="3" fill="#ffd166"/>
        <rect x="2" y="12" width="10" height="8" rx="3" ry="3" fill="#ffd166"/>
      </g>
    </g>
    <text x="18" y="92" class="sm">Amal Hkiri — Ingénierie Logicielle</text>
  </g>

  <!-- signature dots -->
  <circle cx="60" cy="240" r="6" fill="#7b2ff7" />
  <circle cx="80" cy="240" r="4" fill="#f107a3" />
  <circle cx="100" cy="240" r="3" fill="#ffd166" />

</svg>
